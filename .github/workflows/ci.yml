name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: CI
        run: pnpm workflow:ci

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: mics-out
          path: |
            apps/desktop/out
            plugins/*/dist
          if-no-files-found: error
          retention-days: 7

name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@24
          cache: true

      - name: Install dependencies
        run: pnpm ci

      - name: CI
        run: pnpm run workflow:ci

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: lib
          path: lib
          if-no-files-found: error
          retention-days: 7

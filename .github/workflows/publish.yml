name: Publish
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: CI
        run: pnpm workflow:ci

      - name: Publish to npm
        run: npm publish

      - name: Publish to Github Packages
        run: npm publish --registry https://npm.pkg.github.com/


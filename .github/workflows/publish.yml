name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      registry:
        description: Registry to publish to
        type: choice
        options: [both, npm, github-packages]
        default: both
      dist_tag:
        description: Override the detected dist-tag (required when the ref is not a v* tag)
        type: string
        required: false
        default: ''

jobs:
  meta:
    name: Resolve dist-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dist_tag: ${{ steps.resolve.outputs.dist_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve
        id: resolve
        env:
          REF_TYPE: ${{ github.ref_type }}
          OVERRIDE: ${{ inputs.dist_tag }}
        run: |
          node <<'JS'
          const fs = require('node:fs')

          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version
          const ref = process.env.GITHUB_REF_NAME || ''
          const refType = process.env.REF_TYPE || ''
          const override = process.env.OVERRIDE || ''

          const fail = (message) => {
            console.log(`::error::${message}`)
            process.exit(1)
          }

          const refVersion = refType === 'tag' ? ref.replace(/^v/, '') : ''
          if (refVersion && refVersion !== version) {
            fail(`tag ${ref} does not match package.json version ${version}`)
          }

          let tag = override
          if (!tag) {
            if (!refVersion) {
              fail(`cannot derive a dist-tag from ref ${ref}; pass the dist_tag input`)
            }
            const withoutBuild = version.split('+')[0]
            const dash = withoutBuild.indexOf('-')
            const prerelease = dash === -1 ? '' : withoutBuild.slice(dash + 1)
            tag = prerelease ? prerelease.split('.')[0] : 'latest'
          }

          if (!/^[A-Za-z][A-Za-z0-9._-]*$/.test(tag)) {
            fail(`'${tag}' is not a usable dist-tag; pass the dist_tag input`)
          }

          console.log(`version=${version} ref=${ref} dist-tag=${tag}`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `dist_tag=${tag}\n`)
          JS

  publish-npm:
    name: Publish to npm
    needs: meta
    if: github.event_name == 'push' || inputs.registry == 'both' || inputs.registry == 'npm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true

      - name: Install dependencies
        run: pnpm ci

      - name: Publish to npm
        run: npm publish --access public --tag "${{ needs.meta.outputs.dist_tag }}"

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: meta
    if: github.event_name == 'push' || inputs.registry == 'both' || inputs.registry == 'github-packages'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Publish to GitHub Packages
        run: pnpm publish --no-git-checks --tag "${{ needs.meta.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
